resources:
  dashboards:
    smoke_dashboard:
      display_name: SA Coding — Smoke
      file_path: ../../dashboards/smoke.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # Dashboards are edited in the Databricks UI far more comfortably than in
      # JSON. Round-trip workflow:
      #   1. `make deploy`         -> pushes this JSON up
      #   2. edit in the UI
      #   3. `make pull-dashboard` -> writes the UI version back to this file
      #   4. commit
      # embed_credentials: false means a UI edit is NOT silently clobbered on
      # the next deploy — the CLI errors instead, reminding you to pull first.
      embed_credentials: false
